<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Signup Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 24px;
            color: #333333;
            font-size: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: 500;
            color: #555555;
            font-size: 14px;
        }

        input {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #007bff;
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            min-height: 16px;
        }

        .success-message {
            color: #28a745;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            min-height: 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Sign Up</h2>
        <form id="signupForm" onsubmit="handleSubmit(event)">
            
            <!-- Email Input -->
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="text" 
                    id="email" 
                    placeholder="Enter your email" 
                    oninput="handleEmailChange(event)"
                >
                <div id="emailError" class="error-message">Email must be > 3 chars and contain '@' and '.'</div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your password" 
                    oninput="handlePasswordChange(event)"
                >
                <div id="passwordError" class="error-message">Password must be more than 8 characters</div>
            </div>

            <!-- Success Status Message -->
            <div id="successStatus" class="success-message"></div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn">Sign Up</button>
        </form>
    </div>

    <script>
        let isEmailValid = false;
        let isPasswordValid = false;

        function handleEmailChange(event) {
            const email = event.target.value;
            const emailError = document.getElementById('emailError');
            
            // Check if email has > 3 characters, contains '@', and contains '.'
            if (email.length > 3 && email.includes('@') && email.includes('.')) {
                emailError.textContent = ''; // Remove red error
                isEmailValid = true;
            } else {
                emailError.textContent = "Email must be > 3 chars and contain '@' and '.'";
                isEmailValid = false;
            }

            checkFormStatus();
        }

        function handlePasswordChange(event) {
            const password = event.target.value;
            const passwordError = document.getElementById('passwordError');

            // Check if password has more than 8 characters
            if (password.length > 8) {
                passwordError.textContent = ''; // Remove red error
                isPasswordValid = true;
            } else {
                passwordError.textContent = "Password must be more than 8 characters";
                isPasswordValid = false;
            }

            checkFormStatus();
        }

        function checkFormStatus() {
            const successStatus = document.getElementById('successStatus');

            if (isEmailValid && isPasswordValid) {
                successStatus.textContent = 'All good to go!';
            } else {
                successStatus.textContent = '';
            }
        }

        function handleSubmit(event) {
            event.preventDefault();

            // Ensure both validations pass before allowing submission actions
            if (isEmailValid && isPasswordValid) {
                const userConfirmed = window.confirm("Are you sure you want to submit?");

                if (userConfirmed) {
                    alert("Successful signup!");
                } else {
                    // Redirect to the same page and clear all input values
                    window.location.reload();
                }
            } else {
                alert("Please fill out the form correctly before submitting.");
            }
        }
    </script>

</body>
</html>
