<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee management</title>
    

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Employee Management Form</h1>

        <!-- Form Section -->
        <form id="employeeForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="name" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Profession</label>
                <input type="text" id="profession" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Age</label>
                <input type="number" id="age" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-purple-600 text-white p-2 rounded-md hover:bg-purple-700 font-semibold transition">Add Employee</button>
        </form>

        
        <div id="message" class="mt-4 text-sm font-medium"></div>

        
        <div class="mt-8">
            <h2 id="employeeCountHeader" class="text-xl font-bold text-gray-800 mb-4">Added Employees(0)</h2>
            <div id="employeeList" class="space-y-3">
                <!-- Mapped employees will appear here -->
            </div>
        </div>
    </div>

    <script>
        let employees = [];

        const form = document.getElementById('employeeForm');
        const nameInput = document.getElementById('name');
        const professionInput = document.getElementById('profession');
        const ageInput = document.getElementById('age');
        const messageDiv = document.getElementById('message');
        const employeeList = document.getElementById('employeeList');
        const employeeCountHeader = document.getElementById('employeeCountHeader');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = nameInput.value.trim();
            const profession = professionInput.value.trim();
            const age = ageInput.value.trim();

            // Validation: Check if fields are empty
            if (!name || !profession || !age) {
                messageDiv.textContent = "Error: Please fill all the required fields";
                messageDiv.className = "mt-4 text-sm font-medium text-red-600";
                return;
            }

            const newEmployee = {
                id: employees.length > 0 ? employees[employees.length - 1].id + 1 : 1,
                name: name,
                profession: profession,
                age: Number(age)
            };

            employees.push(newEmployee);

            messageDiv.textContent = "Success: The Employee was added successfully";
            messageDiv.className = "mt-4 text-sm font-medium text-green-600";

            nameInput.value = '';
            professionInput.value = '';
            ageInput.value = '';

            renderEmployees();
        });

        function deleteEmployee(id) {
            employees = employees.filter(emp => emp.id !== id);
            renderEmployees();
        }

        function renderEmployees() {
            employeeList.innerHTML = '';
            employeeCountHeader.textContent = `Added Employees(${employees.length})`;

            if (employees.length === 0) {
                employeeList.innerHTML = `<p class="text-gray-500 italic">0 added employees</p>`;
                return;
            }

            employees.forEach(emp => {
                const card = document.createElement('div');
                card.className = "flex justify-between items-center p-4 border border-gray-200 rounded-md bg-gray-50 shadow-sm";
                
                card.innerHTML = `
                    <div>
                        <span class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-xs font-bold mr-2">${emp.id}</span>
                        <span class="font-semibold text-gray-800">Name: ${emp.name}</span> | 
                        <span class="text-gray-600">Profession: ${emp.profession}</span> | 
                        <span class="text-gray-600">Age: ${emp.age}</span>
                    </div>
                    <button onclick="deleteEmployee(${emp.id})" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 text-sm transition">Delete User</button>
                `;

                employeeList.appendChild(card);
            });
        }

        
        renderEmployees();
    </script>
</body>
</html>
